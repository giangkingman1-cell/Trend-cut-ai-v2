# Upload this file to: .github/workflows/build-v2.yml
# The Android source project is embedded below so only this one workflow file needs to be added.
name: TREND CUT AI V2.1.0 - Build APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
