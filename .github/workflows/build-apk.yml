
name: Build TREND CUT AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          unzip -q TREND-CUT-AI-V2-source-for-github.zip -d source

      - name: Fix JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/trend-cut-ai-v2-android-mvp/app/build.gradle.kts")
          s = p.read_text()
          marker = "    defaultConfig {"
          config = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          defaultConfig {"""
          if marker not in s:
              raise SystemExit("defaultConfig not found")
          p.write_text(s.replace(marker, config, 1))
          PY

      - name: Build APK
        run: |
          gradle --no-daemon -p source/trend-cut-ai-v2-android-mvp :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TREND-CUT-AI-V2-APK
          path: source/trend-cut-ai-v2-android-mvp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          
